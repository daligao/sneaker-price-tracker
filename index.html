<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球鞋价格追踪器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,'Segoe UI',sans-serif;background:#0f0f0f;color:#e5e5e5;min-height:100vh}

    header{padding:20px 24px 14px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    header h1{font-size:1.4rem;font-weight:700;color:#fff}
    header p{color:#555;font-size:.82rem;margin-top:3px}
    .jj-tag{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#7c6af7,#f59e0b);border-radius:6px;padding:2px 10px;font-size:.75rem;font-weight:700;color:#fff;margin-left:8px}
    .badge{display:inline-block;background:#1a1a2e;border:1px solid #333;color:#7c6af7;font-size:.72rem;padding:2px 8px;border-radius:4px;margin-top:6px}

    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:all .15s}
    .btn-primary{background:#7c6af7;color:#fff}.btn-primary:hover{background:#6b5ce7}
    .btn-ghost{background:transparent;color:#666;border:1px solid #2a2a2a}.btn-ghost:hover{border-color:#555;color:#ccc}
    .btn:disabled{opacity:.4;cursor:not-allowed}

    /* Dashboard cards */
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:20px 24px}
    .card{background:#161616;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s}
    .card:hover{border-color:#7c6af7}
    .card.active{border-color:#7c6af7;background:#1a1730}
    .card-img{width:100%;height:160px;object-fit:contain;background:#0d0d0d;padding:12px}
    .card-img-placeholder{width:100%;height:160px;background:#111;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
    .card-body{padding:14px 16px}
    .card-name{font-size:.85rem;font-weight:600;color:#fff;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card-sku{font-size:.7rem;color:#444;margin-bottom:10px}
    .card-price{font-size:1.6rem;font-weight:700;color:#7c6af7}
    .card-price span{font-size:.85rem;color:#555}
    .card-meta{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
    .pill{font-size:.72rem;padding:2px 8px;border-radius:99px;background:#1a1a1a;border:1px solid #2a2a2a}
    .pill.premium{color:#f59e0b;border-color:#451a03}
    .pill.change-up{color:#f87171;border-color:#450a0a}
    .pill.change-down{color:#4ade80;border-color:#052e16}
    .card-date{font-size:.68rem;color:#333;margin-top:6px}

    /* Chart */
    .chart-section{padding:0 24px 24px}
    .chart-title{font-size:.82rem;color:#666;margin-bottom:10px}
    .chart-wrap{background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:18px;height:280px;position:relative}

    /* Settings overlay */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
    .overlay.open{display:flex}
    .box{background:#111;border:1px solid #2a2a2a;border-radius:16px;width:100%;max-width:600px;margin:auto}
    .box-head{padding:18px 22px 14px;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between}
    .box-head h2{font-size:1rem;font-weight:700}
    .box-body{padding:18px 22px}
    .box-foot{padding:14px 22px;border-top:1px solid #1e1e1e;display:flex;gap:10px;justify-content:flex-end}

    .sec-label{font-size:.7rem;color:#555;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
    .input{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 12px;color:#e5e5e5;font-size:.85rem;width:100%;outline:none}
    .input:focus{border-color:#7c6af7}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

    /* Shoe item in settings */
    .shoe-item{background:#161616;border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:8px;display:grid;gap:8px;position:relative}
    .shoe-item .del-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:#444;cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px}
    .shoe-item .del-btn:hover{color:#f87171;background:#1a0505}
    .shoe-preview{display:flex;align-items:center;gap:10px;background:#0d0d0d;border-radius:8px;padding:8px;margin-bottom:4px}
    .shoe-preview img{width:64px;height:40px;object-fit:contain}
    .shoe-preview .info{flex:1;min-width:0}
    .shoe-preview .info b{font-size:.8rem;color:#fff;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .shoe-preview .info small{font-size:.7rem;color:#555}

    /* Search results */
    .search-wrap{position:relative}
    .search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#1a1a1a;border:1px solid #333;border-radius:10px;z-index:10;max-height:260px;overflow-y:auto}
    .search-result-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid #222;transition:background .15s}
    .search-result-item:last-child{border-bottom:none}
    .search-result-item:hover{background:#222}
    .search-result-item img{width:56px;height:36px;object-fit:contain;background:#0d0d0d;border-radius:6px;flex-shrink:0}
    .search-result-item .sinfo{flex:1;min-width:0}
    .search-result-item .sname{font-size:.82rem;color:#e5e5e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .search-result-item .smeta{font-size:.7rem;color:#555;margin-top:2px}
    .search-result-item .sprice{font-size:.82rem;color:#7c6af7;font-weight:600;flex-shrink:0}
    .search-hint{padding:10px 12px;font-size:.78rem;color:#444;text-align:center}

    .status-msg{font-size:.8rem;padding:9px 12px;border-radius:8px;margin-top:10px;display:none}
    .status-msg.ok{display:block;background:#052e16;color:#4ade80;border:1px solid #166534}
    .status-msg.err{display:block;background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
    .status-msg.info{display:block;background:#1e1b4b;color:#a5b4fc;border:1px solid #3730a3}

    .empty{text-align:center;padding:60px 24px;color:#333}
    footer{padding:12px 24px;border-top:1px solid #111;font-size:.7rem;color:#2a2a2a}
    a{color:#444}
  </style>
</head>
<body>

<header>
  <div>
    <h1>球鞋价格追踪器 <span class="jj-tag">👟 JJ专属</span></h1>
    <p>GitHub Actions 每日自动运行 · 零费用</p>
    <span class="badge" id="update-badge">加载中...</span>
  </div>
  <button class="btn btn-ghost" onclick="openSettings()">⚙ 管理球鞋 / 立即运行</button>
</header>

<div id="app"><div class="empty">加载数据中...</div></div>

<!-- Settings overlay -->
<div class="overlay" id="overlay" onclick="overlayBg(event)">
  <div class="box">
    <div class="box-head">
      <h2>管理球鞋</h2>
      <button class="btn btn-ghost" onclick="closeSettings()" style="padding:4px 10px">✕</button>
    </div>
    <div class="box-body">

      <div class="sec-label">GitHub Token（仅存本地浏览器）</div>
      <div style="display:flex;gap:8px">
        <input type="password" class="input" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="flex:1">
        <button class="btn btn-ghost" onclick="saveToken()" style="white-space:nowrap">保存</button>
      </div>
      <div style="margin-top:5px;font-size:.73rem;color:#3a3a3a">
        需要 contents:write + actions:write 权限 ·
        <a href="https://github.com/settings/tokens/new" target="_blank" style="color:#7c6af7">生成 Token</a>
      </div>

      <div class="sec-label">搜索并添加球鞋</div>
      <div class="search-wrap">
        <input class="input" id="searchInput" placeholder="输入鞋款名称，如 Jordan 1 Chicago…" oninput="onSearch(this.value)">
        <div class="search-results" id="searchResults" style="display:none"></div>
      </div>

      <div class="sec-label">追踪列表</div>
      <div id="shoeList"><div style="color:#333;font-size:.8rem;padding:6px">暂无球鞋，搜索后添加</div></div>

      <div id="statusMsg" class="status-msg"></div>
    </div>
    <div class="box-foot">
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveAndRun()">💾 保存 &amp; 立即运行</button>
    </div>
  </div>
</div>

<script>
const REPO = 'daligao/sneaker-price-tracker';
const WORKFLOW = 'track.yml';
const SNEAKER_API = 'https://api.thesneakerdatabase.com/v1/sneakers';

let chartInstance = null;
let allData = {};
let activeShoe = null;
let localConfig = null;
let managedShoes = [];  // current list in settings form
let searchTimer = null;

// ── GitHub API ───────────────────────────────────────────────────────────────
const getToken = () => localStorage.getItem('gh_token') || '';

async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' }
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.json();
}

async function ghPut(path, body) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${await r.text()}`);
  return r.json();
}

async function ghTrigger() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ ref: 'main' })
  });
  if (!r.ok) throw new Error(`Trigger ${r.status}: ${await r.text()}`);
}

// ── Sneaker Database API ─────────────────────────────────────────────────────
async function searchSneakers(q) {
  try {
    const r = await fetch(`${SNEAKER_API}?limit=8&name=${encodeURIComponent(q)}`);
    if (!r.ok) return [];
    const data = await r.json();
    return data.results || [];
  } catch { return []; }
}

function onSearch(val) {
  clearTimeout(searchTimer);
  const box = document.getElementById('searchResults');
  if (val.length < 2) { box.style.display = 'none'; return; }
  box.innerHTML = '<div class="search-hint">搜索中...</div>';
  box.style.display = 'block';
  searchTimer = setTimeout(async () => {
    const results = await searchSneakers(val);
    if (!results.length) {
      box.innerHTML = '<div class="search-hint">没有找到结果，换个关键词试试</div>';
      return;
    }
    box.innerHTML = results.map(s => {
      const img = s.media?.thumbUrl || s.thumbnail || '';
      const retail = s.retailPrice ? `¥${Math.round(s.retailPrice * 7.1)} · 零售` : '';
      const release = s.releaseDate ? s.releaseDate.slice(0,7) : '';
      return `<div class="search-result-item" onclick='pickSneaker(${JSON.stringify(JSON.stringify(s))})'>
        <img src="${img}" onerror="this.style.display='none'" loading="lazy">
        <div class="sinfo">
          <div class="sname">${s.title || s.name}</div>
          <div class="smeta">${s.sku||''} ${release ? '· '+release : ''}</div>
        </div>
        <div class="sprice">${retail}</div>
      </div>`;
    }).join('');
  }, 350);
}

function pickSneaker(jsonStr) {
  const s = JSON.parse(jsonStr);
  const shoe = {
    name: s.title || s.name || '',
    sku: s.sku || '',
    size: 'US 10',
    keywords: s.title || s.name || '',
    brand: s.brand || '',
    colorway: s.colorway || '',
    retailPrice: s.retailPrice || 0,
    retailPriceCNY: s.retailPrice ? Math.round(s.retailPrice * 7.1) : 0,
    releaseDate: s.releaseDate || '',
    imageUrl: s.media?.imageUrl || s.media?.smallImageUrl || s.thumbnail || '',
    thumbUrl: s.media?.thumbUrl || s.thumbnail || '',
  };
  managedShoes.push(shoe);
  renderShoeList();
  // clear search
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').style.display = 'none';
}

// ── Settings form ─────────────────────────────────────────────────────────────
function renderShoeList() {
  const el = document.getElementById('shoeList');
  if (!managedShoes.length) {
    el.innerHTML = '<div style="color:#333;font-size:.8rem;padding:6px">暂无球鞋，搜索后添加</div>';
    return;
  }
  el.innerHTML = managedShoes.map((s, i) => `
    <div class="shoe-item">
      <button class="del-btn" onclick="removeShoe(${i})">✕</button>
      ${s.thumbUrl ? `<div class="shoe-preview">
        <img src="${s.thumbUrl}" onerror="this.style.display='none'">
        <div class="info">
          <b>${s.name}</b>
          <small>${s.sku} ${s.colorway ? '· '+s.colorway : ''}</small>
          ${s.retailPriceCNY ? `<small style="color:#7c6af7;display:block">零售 ¥${s.retailPriceCNY}</small>` : ''}
        </div>
      </div>` : `<div style="font-size:.85rem;color:#ccc;font-weight:600;padding-right:24px">${s.name}</div>`}
      <div class="row2">
        <input class="input" placeholder="尺码" value="${s.size||'US 10'}" onchange="managedShoes[${i}].size=this.value">
        <input class="input" placeholder="SKU" value="${s.sku||''}" onchange="managedShoes[${i}].sku=this.value">
      </div>
    </div>
  `).join('');
}

function removeShoe(i) {
  managedShoes.splice(i, 1);
  renderShoeList();
}

// ── Settings open/close ──────────────────────────────────────────────────────
async function openSettings() {
  document.getElementById('overlay').classList.add('open');
  document.getElementById('tokenInput').value = getToken();
  document.getElementById('statusMsg').className = 'status-msg';
  managedShoes = [];

  try {
    let cfg;
    if (getToken()) {
      const file = await ghGet('contents/config.json');
      cfg = JSON.parse(atob(file.content.replace(/\n/g, '')));
    } else {
      cfg = await fetch('config.json').then(r => r.json());
    }
    localConfig = cfg;
    managedShoes = cfg.sneakers || [];
  } catch { localConfig = { sneakers: [], demo_mode: true }; }
  renderShoeList();
}

function closeSettings() { document.getElementById('overlay').classList.remove('open'); }
function overlayBg(e) { if (e.target === document.getElementById('overlay')) closeSettings(); }

function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (t) { localStorage.setItem('gh_token', t); showStatus('Token 已保存', 'ok'); }
  else { localStorage.removeItem('gh_token'); showStatus('Token 已清除', 'info'); }
}

async function saveAndRun() {
  if (!getToken()) { showStatus('请先填写并保存 GitHub Token', 'err'); return; }
  if (!managedShoes.length) { showStatus('请至少添加一双鞋', 'err'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    showStatus('读取当前文件...', 'info');
    const file = await ghGet('contents/config.json');
    const newCfg = { ...(localConfig||{}), sneakers: managedShoes, demo_mode: localConfig?.demo_mode ?? true };
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newCfg, null, 2))));
    showStatus('更新 config.json...', 'info');
    await ghPut('contents/config.json', { message: `config: update ${managedShoes.length} sneakers`, content, sha: file.sha });
    showStatus('触发 GitHub Actions...', 'info');
    await ghTrigger();
    showStatus('✅ 完成！约 30 秒后刷新页面查看结果', 'ok');
    btn.textContent = '✅ 已触发';
    setTimeout(() => { btn.disabled = false; btn.textContent = '💾 保存 & 立即运行'; }, 6000);
  } catch(e) {
    showStatus('❌ ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '💾 保存 & 立即运行';
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = 'status-msg ' + type;
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch('data/prices.json?t=' + Date.now());
    if (!r.ok) throw new Error();
    allData = await r.json();
    // Also load config for images and retail prices
    try {
      const cfg = await fetch('config.json').then(r => r.json());
      (cfg.sneakers || []).forEach(s => {
        if (allData[s.name]) allData[s.name]._meta = s;
      });
    } catch {}
    render();
  } catch {
    document.getElementById('app').innerHTML = `<div class="empty">
      <p style="color:#555">暂无数据</p>
      <p style="margin-top:10px;font-size:.8rem">点右上角「管理球鞋」添加鞋款，再点「立即运行」</p>
    </div>`;
  }
}

function getChange(records) {
  if (records.length < 2) return null;
  const a = records[records.length-1].price, b = records[records.length-2].price;
  return { diff: a-b, pct: (((a-b)/b)*100).toFixed(1) };
}

function render() {
  const names = Object.keys(allData);
  if (!names.length) return;
  const allDates = names.flatMap(n => allData[n].records.map(r => r.date));
  document.getElementById('update-badge').textContent = '最后更新: ' + (allDates.sort().pop() || '—');

  let html = '<div class="cards">';
  names.forEach((name, i) => {
    const d = allData[name];
    const latest = d.records[d.records.length-1];
    if (!latest) return;
    if (!activeShoe && i === 0) activeShoe = name;
    const meta = d._meta || {};
    const change = getChange(d.records);
    const active = activeShoe === name ? 'active' : '';

    // Premium over retail
    let premiumPill = '';
    if (meta.retailPriceCNY && latest.price) {
      const prem = ((latest.price / meta.retailPriceCNY - 1) * 100).toFixed(0);
      if (prem > 0) premiumPill = `<span class="pill premium">+${prem}% 溢价</span>`;
    }

    let changePill = '';
    if (change) {
      const cls = change.diff > 0 ? 'change-up' : 'change-down';
      const sign = change.diff > 0 ? '+' : '';
      changePill = `<span class="pill ${cls}">${sign}¥${Math.abs(change.diff).toFixed(0)} 较昨日</span>`;
    }

    const imgHtml = meta.imageUrl
      ? `<img class="card-img" src="${meta.imageUrl}" loading="lazy" onerror="this.outerHTML='<div class=card-img-placeholder>👟</div>'">`
      : `<div class="card-img-placeholder">👟</div>`;

    html += `<div class="card ${active}" onclick="selectShoe('${name.replace(/'/g,"\\'")}')">
      ${imgHtml}
      <div class="card-body">
        <div class="card-name" title="${name}">${name}</div>
        <div class="card-sku">${meta.sku||d.sku||''} ${meta.colorway ? '· '+meta.colorway : ''}</div>
        <div class="card-price">¥${Number(latest.price).toLocaleString()}<span> 二手</span></div>
        ${meta.retailPriceCNY ? `<div style="font-size:.75rem;color:#444;margin-top:2px">零售 ¥${meta.retailPriceCNY.toLocaleString()}</div>` : ''}
        <div class="card-meta">${premiumPill}${changePill}</div>
        <div class="card-date">
          ${latest.date}
          ${latest.source === 'dewu' && latest.url && latest.url !== '#'
            ? ` · <a href="${latest.url}" target="_blank" style="color:#7c6af7;text-decoration:none">得物查看 →</a>`
            : ` · ${latest.source}`}
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="chart-section">
    <div class="chart-title">价格走势 — ${activeShoe}</div>
    <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
  </div>`;
  document.getElementById('app').innerHTML = html;
  drawChart(activeShoe);
}

function selectShoe(name) { activeShoe = name; render(); }

function drawChart(name) {
  const d = allData[name];
  if (!d?.records.length) return;
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('priceChart').getContext('2d');
  const prices = d.records.map(r => r.price);
  const retail = d._meta?.retailPriceCNY;
  const datasets = [{
    label: '二手价(¥)', data: prices,
    borderColor: '#7c6af7', backgroundColor: 'rgba(124,106,247,0.08)',
    pointBackgroundColor: '#7c6af7', pointRadius: prices.length > 30 ? 2 : 4,
    fill: true, tension: 0.3
  }];
  if (retail) datasets.push({
    label: `零售价 ¥${retail.toLocaleString()}`,
    data: d.records.map(() => retail),
    borderColor: '#f59e0b', borderDash: [6,4], borderWidth: 1.5,
    pointRadius: 0, fill: false, tension: 0
  });
  chartInstance = new Chart(ctx, {
    type: 'line', data: { labels: d.records.map(r => r.date), datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#555', font: { size: 11 } } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ¥${Number(c.parsed.y).toLocaleString()}` } }
      },
      scales: {
        x: { ticks: { color: '#555', maxTicksLimit: 8 }, grid: { color: '#1e1e1e' } },
        y: { ticks: { color: '#555', callback: v => '¥' + v.toLocaleString() }, grid: { color: '#1e1e1e' } }
      }
    }
  });
}

loadData();
</script>

<footer>每日自动更新 · GitHub Actions · <a href="https://github.com/daligao/sneaker-price-tracker">源码</a></footer>
</body>
</html>
