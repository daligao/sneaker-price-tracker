<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球鞋价格追踪器</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
    }
    header {
      padding: 24px 24px 14px;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    header p { color: #555; font-size: 0.82rem; margin-top: 3px; }
    .badge { display:inline-block; background:#1a1a2e; border:1px solid #333; color:#7c6af7; font-size:.72rem; padding:2px 8px; border-radius:4px; margin-top:6px; }
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:0.85rem; font-weight:600; cursor:pointer; border:none; transition:all 0.15s; }
    .btn-primary { background:#7c6af7; color:#fff; }
    .btn-primary:hover { background:#6b5ce7; }
    .btn-ghost { background:transparent; color:#666; border:1px solid #2a2a2a; }
    .btn-ghost:hover { border-color:#555; color:#ccc; }
    .btn-danger { background:#7f1d1d; color:#fca5a5; border:none; }
    .btn-danger:hover { background:#991b1b; }
    .btn:disabled { opacity:0.4; cursor:not-allowed; }

    /* Cards */
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; padding:20px 24px; }
    .card { background:#161616; border:1px solid #2a2a2a; border-radius:12px; padding:18px; cursor:pointer; transition:border-color 0.2s; }
    .card:hover { border-color:#7c6af7; }
    .card.active { border-color:#7c6af7; background:#1a1730; }
    .card-name { font-size:0.88rem; font-weight:600; color:#fff; margin-bottom:3px; }
    .card-sku { font-size:0.72rem; color:#444; margin-bottom:10px; }
    .card-price { font-size:1.7rem; font-weight:700; color:#7c6af7; }
    .card-price span { font-size:0.9rem; color:#666; }
    .card-change { font-size:0.78rem; margin-top:3px; }
    .up{color:#f87171} .down{color:#4ade80} .flat{color:#555}
    .card-date { font-size:0.7rem; color:#333; margin-top:5px; }

    /* Chart */
    .chart-section { padding:0 24px 24px; }
    .chart-title { font-size:0.82rem; color:#666; margin-bottom:10px; }
    .chart-wrap { background:#161616; border:1px solid #2a2a2a; border-radius:12px; padding:18px; height:280px; position:relative; }

    /* Settings panel */
    .settings-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:100; align-items:center; justify-content:center; padding:16px; }
    .settings-overlay.open { display:flex; }
    .settings-box { background:#111; border:1px solid #2a2a2a; border-radius:16px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; }
    .settings-head { padding:20px 24px 16px; border-bottom:1px solid #1e1e1e; display:flex; align-items:center; justify-content:space-between; }
    .settings-head h2 { font-size:1rem; font-weight:700; }
    .settings-body { padding:20px 24px; }
    .section-label { font-size:0.72rem; color:#555; text-transform:uppercase; letter-spacing:.06em; margin:16px 0 8px; }
    .token-row { display:flex; gap:8px; }
    .input { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:8px; padding:9px 12px; color:#e5e5e5; font-size:0.85rem; width:100%; outline:none; }
    .input:focus { border-color:#7c6af7; }
    .shoe-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; padding:12px; background:#161616; border:1px solid #222; border-radius:10px; position:relative; }
    .shoe-row .del { position:absolute; top:8px; right:8px; background:none; border:none; color:#555; cursor:pointer; font-size:1rem; padding:2px 6px; border-radius:4px; }
    .shoe-row .del:hover { color:#f87171; background:#1a0505; }
    .shoe-row .full { grid-column:1/-1; }
    .settings-foot { padding:16px 24px; border-top:1px solid #1e1e1e; display:flex; gap:10px; justify-content:flex-end; }
    .status-msg { font-size:0.8rem; padding:10px 12px; border-radius:8px; margin-top:12px; display:none; }
    .status-msg.ok { display:block; background:#052e16; color:#4ade80; border:1px solid #166534; }
    .status-msg.err { display:block; background:#450a0a; color:#fca5a5; border:1px solid #7f1d1d; }
    .status-msg.info { display:block; background:#1e1b4b; color:#a5b4fc; border:1px solid #3730a3; }

    .empty { text-align:center; padding:60px 24px; color:#333; }
    footer { padding:14px 24px; border-top:1px solid #111; font-size:0.72rem; color:#2a2a2a; }
    a { color:#444; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>球鞋价格追踪器</h1>
    <p>GitHub Actions 每日自动运行 · 零费用</p>
    <span class="badge" id="update-badge">加载中...</span>
  </div>
  <button class="btn btn-ghost" onclick="openSettings()">⚙ 管理球鞋 / 立即运行</button>
</header>

<div id="app"><div class="empty">加载数据中...</div></div>

<!-- Settings Overlay -->
<div class="settings-overlay" id="settingsOverlay" onclick="overlayClick(event)">
  <div class="settings-box">
    <div class="settings-head">
      <h2>管理配置</h2>
      <button class="btn btn-ghost" onclick="closeSettings()" style="padding:4px 10px">✕</button>
    </div>
    <div class="settings-body">

      <div class="section-label">GitHub Token（存在本地，不上传）</div>
      <div class="token-row">
        <input type="password" class="input" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <button class="btn btn-ghost" onclick="saveToken()" style="white-space:nowrap">保存</button>
      </div>
      <div style="margin-top:6px;font-size:0.75rem;color:#444">
        需要 <code style="color:#7c6af7">contents:write</code> + <code style="color:#7c6af7">actions:write</code> 权限的 Fine-grained PAT
        · <a href="https://github.com/settings/tokens/new" target="_blank" style="color:#7c6af7">生成Token</a>
      </div>

      <div class="section-label">追踪的球鞋</div>
      <div id="shoeList"></div>
      <button class="btn btn-ghost" onclick="addShoe()" style="margin-top:8px;width:100%;justify-content:center">+ 添加球鞋</button>

      <div id="statusMsg" class="status-msg"></div>
    </div>
    <div class="settings-foot">
      <button class="btn btn-ghost" onclick="closeSettings()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveAndRun()">💾 保存 &amp; 立即运行</button>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const REPO = 'daligao/sneaker-price-tracker';
const WORKFLOW = 'track.yml';

let chartInstance = null;
let allData = {};
let activeShoe = null;
let localConfig = null;  // config loaded from repo

// ── GitHub API helpers ───────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('gh_token') || ''; }

async function ghGet(path) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' }
  });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
  return r.json();
}

async function ghPut(path, body) {
  const r = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
  return r.json();
}

async function ghTriggerWorkflow() {
  const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ ref: 'main' })
  });
  if (!r.ok) throw new Error(`Trigger failed ${r.status}: ${await r.text()}`);
}

// ── Dashboard ────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const res = await fetch('data/prices.json?t=' + Date.now());
    if (!res.ok) throw new Error();
    allData = await res.json();
    render();
  } catch {
    document.getElementById('app').innerHTML = `<div class="empty">
      <p style="color:#555">暂无数据</p>
      <p style="margin-top:10px;font-size:0.8rem">点右上角"管理球鞋"→ 立即运行，等约1分钟</p>
    </div>`;
  }
}

function getChange(records) {
  if (records.length < 2) return null;
  const latest = records[records.length-1].price;
  const prev = records[records.length-2].price;
  const diff = latest - prev;
  return { diff, pct: ((diff/prev)*100).toFixed(1) };
}

function render() {
  const names = Object.keys(allData);
  if (!names.length) return;
  const allDates = names.flatMap(n => allData[n].records.map(r => r.date));
  document.getElementById('update-badge').textContent = '最后更新: ' + (allDates.sort().pop() || '—');

  let html = '<div class="cards">';
  names.forEach((name, i) => {
    const d = allData[name];
    const latest = d.records[d.records.length-1];
    if (!latest) return;
    if (activeShoe === null && i === 0) activeShoe = name;
    const change = getChange(d.records);
    let chHtml = '<span class="flat">—</span>';
    if (change) {
      const cls = change.diff > 0 ? 'up' : change.diff < 0 ? 'down' : 'flat';
      const sign = change.diff > 0 ? '+' : '';
      chHtml = `<span class="${cls}">${sign}¥${Math.abs(change.diff).toFixed(0)} (${sign}${change.pct}%)</span>`;
    }
    const active = activeShoe === name ? 'active' : '';
    html += `<div class="card ${active}" onclick="selectShoe('${name.replace(/'/g,"\\'")}')">
      <div class="card-name">${name}</div>
      <div class="card-sku">${d.sku||''}</div>
      <div class="card-price">¥${Number(latest.price).toLocaleString()}<span> CNY</span></div>
      <div class="card-change">${chHtml} 较昨日</div>
      <div class="card-date">${latest.date} · ${latest.source}</div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="chart-section">
    <div class="chart-title">价格走势 — ${activeShoe}</div>
    <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
  </div>`;
  document.getElementById('app').innerHTML = html;
  drawChart(activeShoe);
}

function selectShoe(name) { activeShoe = name; render(); }

function drawChart(name) {
  const d = allData[name];
  if (!d?.records.length) return;
  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('priceChart').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: d.records.map(r => r.date),
      datasets: [{ label:'价格(¥)', data: d.records.map(r => r.price),
        borderColor:'#7c6af7', backgroundColor:'rgba(124,106,247,0.08)',
        pointBackgroundColor:'#7c6af7', pointRadius: d.records.length > 30 ? 2 : 4,
        fill:true, tension:0.3 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip:{callbacks:{label:c=>`¥${c.parsed.y.toLocaleString()}`}} },
      scales: {
        x: { ticks:{color:'#555',maxTicksLimit:8}, grid:{color:'#1e1e1e'} },
        y: { ticks:{color:'#555',callback:v=>'¥'+v.toLocaleString()}, grid:{color:'#1e1e1e'} }
      }
    }
  });
}

// ── Settings panel ───────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
  document.getElementById('tokenInput').value = getToken();
  document.getElementById('statusMsg').className = 'status-msg';
  loadConfigIntoForm();
}
function closeSettings() { document.getElementById('settingsOverlay').classList.remove('open'); }
function overlayClick(e) { if (e.target === document.getElementById('settingsOverlay')) closeSettings(); }

async function loadConfigIntoForm() {
  // Try from GitHub API first (needs token); fall back to bundled config.json
  const list = document.getElementById('shoeList');
  list.innerHTML = '<div style="color:#444;font-size:0.8rem;padding:8px">加载中...</div>';
  try {
    if (getToken()) {
      const file = await ghGet('contents/config.json');
      localConfig = JSON.parse(atob(file.content.replace(/\n/g,'')));
    } else {
      const r = await fetch('config.json');
      localConfig = await r.json();
    }
  } catch {
    localConfig = { sneakers: [], demo_mode: true };
  }
  renderShoeForm(localConfig.sneakers);
}

function renderShoeForm(sneakers) {
  const list = document.getElementById('shoeList');
  list.innerHTML = '';
  sneakers.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'shoe-row';
    div.dataset.i = i;
    div.innerHTML = `
      <button class="del" onclick="removeShoe(${i})">✕</button>
      <input class="input full" placeholder="球鞋名称（中英文均可）" value="${s.name||''}" data-field="name">
      <input class="input" placeholder="SKU（如 DZ5485-052）" value="${s.sku||''}" data-field="sku">
      <input class="input" placeholder="尺码（如 US 10）" value="${s.size||''}" data-field="size">
      <input class="input full" placeholder="搜索关键词（用于抓价格，英文更准）" value="${s.keywords||''}" data-field="keywords">
    `;
    list.appendChild(div);
  });
}

function getFormSneakers() {
  return [...document.querySelectorAll('.shoe-row')].map(row => ({
    name: row.querySelector('[data-field=name]').value.trim(),
    sku: row.querySelector('[data-field=sku]').value.trim(),
    size: row.querySelector('[data-field=size]').value.trim(),
    keywords: row.querySelector('[data-field=keywords]').value.trim(),
  })).filter(s => s.name);
}

function addShoe() {
  const sneakers = getFormSneakers();
  sneakers.push({ name:'', sku:'', size:'US 10', keywords:'' });
  renderShoeForm(sneakers);
}

function removeShoe(i) {
  const sneakers = getFormSneakers();
  sneakers.splice(i, 1);
  renderShoeForm(sneakers);
}

function saveToken() {
  const t = document.getElementById('tokenInput').value.trim();
  if (t) { localStorage.setItem('gh_token', t); showStatus('Token 已保存到本地浏览器', 'ok'); }
  else { localStorage.removeItem('gh_token'); showStatus('Token 已清除', 'info'); }
}

async function saveAndRun() {
  if (!getToken()) { showStatus('请先填写并保存 GitHub Token', 'err'); return; }
  const sneakers = getFormSneakers();
  if (!sneakers.length) { showStatus('请至少添加一双鞋', 'err'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    // 1. Get current file SHA (required for update)
    showStatus('读取当前配置...', 'info');
    const file = await ghGet('contents/config.json');
    const sha = file.sha;

    // 2. Build new config
    const newConfig = { ...localConfig, sneakers, demo_mode: localConfig?.demo_mode ?? true };
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newConfig, null, 2))));

    // 3. Update config.json
    showStatus('更新 config.json...', 'info');
    await ghPut('contents/config.json', {
      message: `config: update sneaker list (${sneakers.length} shoes)`,
      content,
      sha
    });

    // 4. Trigger GitHub Actions
    showStatus('触发 GitHub Actions...', 'info');
    await ghTriggerWorkflow();

    showStatus('✅ 已保存并触发运行！约 30 秒后刷新页面查看结果。', 'ok');
    btn.textContent = '✅ 已触发';
    setTimeout(() => { btn.disabled = false; btn.textContent = '💾 保存 & 立即运行'; }, 5000);

  } catch (e) {
    showStatus('❌ ' + e.message, 'err');
    btn.disabled = false;
    btn.textContent = '💾 保存 & 立即运行';
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + type;
}

loadData();
</script>

<footer>
  每日自动更新 · GitHub Actions ·
  <a href="https://github.com/daligao/sneaker-price-tracker">源码</a>
</footer>
</body>
</html>
