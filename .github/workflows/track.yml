name: Daily Price Tracker

on:
  schedule:
    # Runs every day at 09:00 UTC (17:00 Beijing time)
    - cron: '0 9 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit data back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 2>/dev/null || true

      - name: Run tracker
        run: python tracker.py

      - name: Commit updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "bot@github-actions"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "data: price update $(date +%Y-%m-%d)"
          git push
